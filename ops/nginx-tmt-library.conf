server {
    server_name 47.99.100.138 tmt-library.cn www.tmt-library.cn;

    location = /index.html {
        root /var/www/tmt-library;
        add_header Cache-Control "no-cache";
    }

    location /assets/ {
        root /var/www/tmt-library;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        root /var/www/tmt-library;
        try_files $uri /index.html;
    }

    location /health {
        proxy_pass http://127.0.0.1:8765;
        proxy_set_header Host $host;
    }

    location /ready {
        proxy_pass http://127.0.0.1:8765;
        proxy_set_header Host $host;
    }

    location /api/version/upload {
        proxy_pass http://127.0.0.1:8765;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 500M;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_request_buffering off;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8765;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 20M;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/tmt-library.cn/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/tmt-library.cn/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}
server {
    if ($host = tmt-library.cn) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    server_name 47.99.100.138 tmt-library.cn www.tmt-library.cn;
    return 404; # managed by Certbot


}
